[project]
name = "instrumentacion-virtual"
version = "0.1.0"
description = "Herramientas para el control de instrumental de medicion"
authors = [
    {name = "Pablo De Cesare, Ramiro Rodriguez Colmeiro, Franco Zaccra"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyvisa (>=1.15.0,<2.0.0)",
    "pyvisa-py (>=0.8.0,<0.9.0)",
    "pyserial (>=3.5,<4.0)",
    "pyusb (>=1.3.1,<2.0.0)",
    "numpy (>=2.3.1,<3.0.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "scipy (>=1.16.0,<2.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "python-vxi11>=0.9",
    "requests>=2.34.2",
    "fpdf2>=2.8.7",
]


[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["InstVirtualLib", "InstVirtualLib.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5,<7.0.0",
    "jupyter>=1.1.1,<2.0.0",
    "ipython>=9.0.0,<10.0.0",
    "ruff>=0.11.0,<1.0.0",
    "pre-commit>=4.0.0,<5.0.0",
]

